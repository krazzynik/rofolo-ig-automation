name: Instagram-only - Publish Post
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: pip install -r requirements.txt
      - run: python schedule_instagram_only_post.py
        env:
          INSTAGRAM_ONLY_USER_ID: ${{ secrets.INSTAGRAM_ONLY_USER_ID }}
          INSTAGRAM_ONLY_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ONLY_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_API_VERSION: v23.0
