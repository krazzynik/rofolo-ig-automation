name: Instagram-only - Publish Reel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.ref_name }} }
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: pip install -r requirements.txt
      - run: python schedule_instagram_only_reel.py
        env:
          INSTAGRAM_ONLY_USER_ID: ${{ secrets.INSTAGRAM_ONLY_USER_ID }}
          INSTAGRAM_ONLY_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ONLY_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_API_VERSION: v23.0
      - name: Commit cleanup and queue state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean up published Instagram-only reel [skip ci]"
          file_pattern: "reels/* scheduled_reels_queue.json"
