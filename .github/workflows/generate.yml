name: 1. Generate Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow google-genai

      - name: Generate Image and Caption
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_image.py

      - name: Commit New Assets and ID State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated post assets [skip ci]"
          file_pattern: "images/* content/* scheduled_queue.json content_state.json"
