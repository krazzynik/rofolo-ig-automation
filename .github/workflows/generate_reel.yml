name: 3. Generate Daily Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Runs daily at 08:00 UTC

jobs:
  generate_reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow moviepy numpy google-genai

      - name: Generate Reel Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_reel.py

      - name: Commit Generated Reel and ID State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated reel assets [skip ci]"
          file_pattern: "reels/* content/* scheduled_reels_queue.json content_state.json"
