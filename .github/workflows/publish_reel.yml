name: 4. Publish Reel to Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # Runs daily at 16:00 UTC

jobs:
  publish_reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Publish Reel
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          RAW_IMAGE_BASE_URL: ${{ secrets.RAW_IMAGE_BASE_URL }}
        run: python publish_reel.py

      - name: Commit Updated Reels Queue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update reels queue status to posted [skip ci]"
          file_pattern: "scheduled_reels_queue.json"